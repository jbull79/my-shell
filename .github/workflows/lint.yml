name: Lint & Format

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      # 🔹 Install linters + formatters
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          npm install -g markdownlint-cli prettier
          pip install flake8 black

      # 🔹 Shell lint + format check
      - name: Run ShellCheck
        id: shellcheck
        continue-on-error: true
        run: |
          echo "🔍 Running ShellCheck..."
          set +e
          find . -type f -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 -n1 shellcheck -x || {
            echo "⚠️ ShellCheck found issues (non-critical)"
            exit 0
          }
          echo "✅ ShellCheck passed"
        shell: bash

      - name: Check shfmt formatting
        id: shfmt
        continue-on-error: true
        run: |
          echo "🧹 Checking shfmt formatting..."
          set +e
          shfmt -d -i 2 -ci -sr . || {
            echo "⚠️ shfmt formatting issues found (non-critical)"
            exit 0
          }
          echo "✅ shfmt formatting passed"
        shell: bash

      # 🔹 Markdown lint + format check
      - name: Check markdown files
        id: markdown
        continue-on-error: true
        run: |
          echo "🧾 Running markdownlint..."
          set +e
          markdownlint "**/*.md" || {
            echo "⚠️ markdownlint found issues (non-critical)"
            exit 0
          }
          echo "✅ markdownlint passed"
        shell: bash

      - name: Check markdown formatting
        id: prettier
        continue-on-error: true
        run: |
          echo "✨ Checking markdown formatting..."
          set +e
          prettier --check "**/*.md" || {
            echo "⚠️ Prettier formatting issues found (non-critical)"
            exit 0
          }
          echo "✅ Prettier formatting passed"
        shell: bash

      # 🔹 Python lint + format check
      - name: Check Python files
        id: python
        continue-on-error: true
        run: |
          echo "🐍 Running Flake8 (critical errors only)..."
          set +e
          # Only check for critical errors: E9 (syntax), F63 (print), F7 (syntax), F82 (undefined)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || {
            echo "❌ Flake8 found CRITICAL errors (syntax/undefined)"
            exit 1
          }
          echo "✅ Flake8 critical checks passed"
          
          # Check formatting but don't fail
          echo "🎨 Checking Black formatting..."
          black --check . || {
            echo "⚠️ Black formatting issues found (non-critical)"
            exit 0
          }
          echo "✅ Black formatting passed"
        shell: bash

      # 🔹 Summary
      - name: Lint Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Lint & Format Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [[ "${{ steps.shellcheck.outcome }}" == "success" ]]; then
            echo "✅ ShellCheck: Passed"
          else
            echo "⚠️  ShellCheck: Warnings (non-critical)"
          fi
          
          if [[ "${{ steps.shfmt.outcome }}" == "success" ]]; then
            echo "✅ shfmt: Passed"
          else
            echo "⚠️  shfmt: Warnings (non-critical)"
          fi
          
          if [[ "${{ steps.markdown.outcome }}" == "success" ]]; then
            echo "✅ markdownlint: Passed"
          else
            echo "⚠️  markdownlint: Warnings (non-critical)"
          fi
          
          if [[ "${{ steps.prettier.outcome }}" == "success" ]]; then
            echo "✅ Prettier: Passed"
          else
            echo "⚠️  Prettier: Warnings (non-critical)"
          fi
          
          if [[ "${{ steps.python.outcome }}" == "success" ]]; then
            echo "✅ Python (Flake8/Black): Passed"
          elif [[ "${{ steps.python.outcome }}" == "failure" ]]; then
            echo "❌ Python: CRITICAL ERRORS FOUND"
            exit 1
          else
            echo "⚠️  Python: Warnings (non-critical)"
          fi
          
          echo ""
          echo "✅ All non-critical checks completed"
          echo "💡 Review warnings above, but workflow will pass"
        shell: bash
